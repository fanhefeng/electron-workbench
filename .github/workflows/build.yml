name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
          - name: Windows
            runner: windows-2025
            platform: win
            arch: x64
          - name: Linux
            runner: ubuntu-24.04
            platform: linux
            arch: x64
    env:
      WORKBENCH_UNSIGNED_RELEASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Validate version tag
        if: github.ref_type == 'tag'
        run: node scripts/prepare-release.mjs --check-tag
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Prepare virtual desktop
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth openbox dbus-x11 dunst libnotify4 libglib2.0-bin libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          # Permit Chromium's user-namespace sandbox inside this ephemeral VM.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test Electron workflows
        if: matrix.platform == 'linux'
        run: |
          for attempt in 1; do
            if xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
              dbus-run-session -- bash -e -c '
                openbox >/tmp/workbench-openbox.log 2>&1 &
                dunst >/tmp/workbench-notifications.log 2>&1 &
                gdbus wait --session --timeout 10 org.freedesktop.Notifications
                timeout --signal=TERM --kill-after=10s 45s node --test --test-name-pattern="^shell renderer crash" scripts/regressions.mjs
              '; then exit 0; fi
            if [[ "$attempt" == 1 ]]; then exit 1; fi
            echo "Native desktop input test failed; retrying in a fresh Electron process ($attempt/2)."
          done
      - name: Build installers
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify macOS signature
        if: matrix.platform == 'mac'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          app_dir=release/mac
          if [[ "$TARGET_ARCH" == arm64 ]]; then app_dir=release/mac-arm64; fi
          codesign --verify --deep --strict "$app_dir/Workbench.app"
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          overwrite: true
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload desktop test screenshots
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-results
          overwrite: true
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Verify installers and generate checksums
        run: node scripts/prepare-release.mjs release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo 'This release is already published; its assets will not be replaced.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file docs/install.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --draft --title "Workbench $RELEASE_TAG" \
              --generate-notes --notes-file docs/install.md --prerelease="$prerelease"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
